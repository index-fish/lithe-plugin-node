name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./io.github.lithe-idea.node-support/plugin.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}"
            exit 1
          fi

      - name: Check plugin skeleton
        run: npm run test

      - name: Build bundled language server
        run: npm run build:ls

      - name: Package plugin
        run: npm run package

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets only"
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip dist/*.zip.sha256 \
              --title "$GITHUB_REF_NAME - Node/JS/TS/XML 支持" \
              --notes "自动构建发布：JS/TS/JSX/TSX 语言服务 + npm scripts 运行入口 + XML 语法诊断。Node >= 20。已过骨架测试与官方规则复核；未在真实 Lithe 宿主端到端验证。"
          fi
