name: Release plugins

on:
  push:
    tags:
      - "node-v*"
      - "xml-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve target plugin from tag
        id: target
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            node-v*) echo "plugin=node" >> "$GITHUB_OUTPUT"; echo "version=${tag#node-v}" >> "$GITHUB_OUTPUT" ;;
            xml-v*)  echo "plugin=xml"  >> "$GITHUB_OUTPUT"; echo "version=${tag#xml-v}"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported tag prefix: $tag" >&2; exit 1 ;;
          esac

      - name: Verify tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          case "${{ steps.target.outputs.plugin }}" in
            node) dir=io.github.lithe-idea.node-support ;;
            xml)  dir=io.github.lithe-idea.xml-support ;;
          esac
          version="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$dir/plugin.json")"
          want="${{ steps.target.outputs.version }}"
          if [ "$want" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} wants ${want}, plugin version is ${version}" >&2
            exit 1
          fi

      - name: Build bundled language servers
        run: npm run build:ls

      - name: Check plugin skeletons
        run: npm run test

      - name: Package plugins
        run: npm run package

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN: ${{ steps.target.outputs.plugin }}
        run: |
          case "$PLUGIN" in
            node)
              dir=io.github.lithe-idea.node-support
              title="Node.js Support"
              notes="Node.js/TypeScript language services and npm scripts run entries. XML support moved to the separate xml-plugin release."
              ;;
            xml)
              dir=io.github.lithe-idea.xml-support
              title="XML Support (LemMinX)"
              notes="XML/XSD/XSL/SVG support via Eclipse LemMinX: syntax + XSD validation, completion, formatting, hover, document symbols, folding, rename, document links. Requires Java 11+ (discovered via Toolchains)."
              ;;
          esac
          version="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$dir/plugin.json")"
          zip="dist/${dir}-${version}.zip"
          if [ ! -f "$zip" ]; then echo "No ZIP for $dir version $version" >&2; exit 1; fi
          assets="$zip ${zip}.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; uploading assets only"
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            gh release create "$GITHUB_REF_NAME" $assets \
              --title "$GITHUB_REF_NAME - $title" \
              --notes "$notes"
          fi
